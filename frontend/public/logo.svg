<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <style>
      /* Thin, solid black strokes as requested */
      .outline { stroke: #000000; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .font-main { font-family: 'Segoe UI', 'Helvetica Neue', sans-serif; font-weight: 800; font-size: 56px; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <!-- Forward-leaning group to create a clean, subtle racing illusion -->
  <g transform="translate(45, 20) skewX(-10)">
    
    <!-- Speed Lines (Left/Back) -->
    <line x1="-15" y1="70" x2="10" y2="70" class="outline" />
    <line x1="-30" y1="150" x2="45" y2="150" class="outline" />

    <!-- Back Key: 'T' for Type (Cyan/Blue) -->
    <rect x="25" y="25" width="96" height="96" rx="16" fill="#38BDF8" class="outline" />
    <!-- Inner Key Face -->
    <rect x="37" y="37" width="72" height="66" rx="10" fill="#E0F2FE" class="outline" />
    <text x="73" y="70" class="font-main">T</text>

    <!-- Front Key: 'B' for Baazi (Yellow/Orange - Leading the race) -->
    <rect x="85" y="95" width="114" height="114" rx="20" fill="#FBBF24" class="outline" />
    <!-- Inner Key Face -->
    <rect x="99" y="109" width="86" height="78" rx="12" fill="#FEF3C7" class="outline" />
    <text x="142" y="146" class="font-main">B</text>

    <!-- Speed Lines / Sparks (Right/Front) -->
    <line x1="205" y1="130" x2="225" y2="130" class="outline" />
    <circle cx="215" cy="175" r="4" fill="#000000" />
    <circle cx="-5" cy="110" r="3" fill="#000000" />
  </g>
</svg>